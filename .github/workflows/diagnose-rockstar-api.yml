name: Diagnose Rockstar 1.21.11 API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-rockstar-api.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone related Rockstar source family
        run: git clone --depth 1 https://github.com/swaga1444/Wave-Visual.git wave
      - name: Patch build versions for API diagnostics
        working-directory: wave
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gradle.properties')
          s=p.read_text()
          for a,b in {
            'minecraft_version=1.21.4':'minecraft_version=1.21.11',
            'yarn_mappings=1.21.4+build.8':'yarn_mappings=1.21.11+build.6',
            'loader_version=0.18.4':'loader_version=0.19.2',
            'fabric_api_version=0.119.4+1.21.4':'fabric_api_version=0.141.6+1.21.11',
          }.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile to expose 1.21.11 API breaks
        working-directory: wave
        run: |
          chmod +x gradlew
          ./gradlew compileJava compileClientJava --stacktrace --warning-mode all
