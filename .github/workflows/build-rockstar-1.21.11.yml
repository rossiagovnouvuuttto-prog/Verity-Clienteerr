name: Build Rockstar 1.21.11 Fabric

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ROCKSTAR-1.21.11-source.zip"
      - ".github/workflows/build-rockstar-1.21.11.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f ROCKSTAR-1.21.11-source.zip || {
            echo "ROCKSTAR-1.21.11-source.zip is missing from repository root"
            exit 1
          }

      - name: Extract source
        run: |
          rm -rf rockstar-build
          mkdir rockstar-build
          unzip -q ROCKSTAR-1.21.11-source.zip -d rockstar-build
          PROJECT_DIR="$(find rockstar-build -maxdepth 2 -type f -name gradlew -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and capture full log
        run: |
          set +e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean build --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/rockstar-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rockstar-1.21.11-build-log
          if-no-files-found: warn
          path: rockstar-build.log

      - name: Show produced files
        if: always()
        run: |
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true

      - name: Upload JAR
        if: env.BUILD_STATUS == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Rockstar-Client-1.21.11-Fabric
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar

      - name: Mark build failed
        if: env.BUILD_STATUS != '0'
        run: |
          echo "Gradle compilation failed. See the Rockstar-1.21.11-build-log artifact."
          exit 1
